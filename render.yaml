# Plano grátis do Render: o serviço dorme após 15 min sem uso e acorda na próxima visita.
# A chave da Garmin fica só no painel do Render (sync: false), nunca no Git.
# Sem APP_PASSWORD o painel abre sem senha. Para proteger de novo, crie essa variável no Render.
services:
  - type: web
    name: life-track
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: GARMIN_PERSONAL_API_KEY
        sync: false

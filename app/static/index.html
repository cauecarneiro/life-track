<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050505">
  <title>Life Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <a class="mark" href="#/"><i aria-hidden="true"></i>Life Track</a>
      <nav class="pills" aria-label="Seções" id="nav"></nav>
      <div class="search" role="search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar um dado, como sono ou HRV" autocomplete="off" spellcheck="false" aria-label="Buscar um dado">
        <ul id="found" class="found" hidden></ul>
      </div>
      <button class="circle" type="button" id="refresh" aria-label="Buscar de novo na Garmin" title="Buscar de novo na Garmin">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">Dados lidos direto da API da Garmin. Nada fica salvo.</footer>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
